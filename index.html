<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050505">
<title>FlightWall</title>
<!-- Schriftarten: bei Offline-Betrieb greift automatisch der Monospace-Fallback -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

<style>
/* =========================================================
   Overhead – Stylesheet
   Farben: Schwarz #050505, Amber #FFB000, Weiß #F5F5F5, Grau #1A1A1A
   ========================================================= */
:root {
  --bg: #050505;
  --amber: #FFB000;
  --amber-dim: #7a5500;
  --white: #F5F5F5;
  --grey: #1A1A1A;
  --grey-text: #6d6d6d;
  --font: 'Share Tech Mono', 'JetBrains Mono', 'Courier New', monospace;
  --font-big: 'VT323', 'Share Tech Mono', 'Courier New', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--white);
  font-family: var(--font);
  -webkit-user-select: none; user-select: none;
}
#app {
  width: 100%; height: 100vh;
  display: grid; grid-template-rows: auto 1fr auto;
  padding: 1.6vmin 2.2vmin 1vmin;
  transition: filter 1.5s;
}
/* Nachtmodus: Display leicht abdunkeln */
body.night #app { filter: brightness(0.4); }

.amber { color: var(--amber); text-shadow: 0 0 1.2vmin rgba(255,176,0,.55); }
.dim   { color: var(--grey-text); }

/* ---------- Kopfzeile ---------- */
header {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  border-bottom: 0.3vmin solid var(--grey); padding-bottom: 1.2vmin;
}
.live { display: flex; align-items: center; gap: 1.4vmin; font-size: 2.4vmin; letter-spacing: .3vmin; color: var(--amber); }
.radar {
  position: relative; width: 5vmin; height: 5vmin; border-radius: 50%;
  border: 0.3vmin solid var(--amber); overflow: hidden; flex: none;
}
.radar::before { /* Radar-Sweep */
  content: ""; position: absolute; inset: 0;
  background: conic-gradient(from 0deg, rgba(255,176,0,0) 0deg, rgba(255,176,0,.85) 70deg, rgba(255,176,0,0) 71deg);
  animation: sweep 2.4s linear infinite;
}
.radar::after { /* Fadenkreuz */
  content: ""; position: absolute; left: 50%; top: 50%; width: 0.6vmin; height: 0.6vmin;
  margin: -0.3vmin 0 0 -0.3vmin; background: var(--amber); border-radius: 50%;
}
@keyframes sweep { to { transform: rotate(360deg); } }
.dot { width: 1.3vmin; height: 1.3vmin; border-radius: 50%; background: #2a2a2a; display: inline-block; }
.dot.ok  { background: #35d36a; box-shadow: 0 0 1vmin #35d36a; }
.dot.err { background: #e5483b; box-shadow: 0 0 1vmin #e5483b; }

#loc { text-align: center; font-size: 4vmin; letter-spacing: .8vmin; color: var(--white); text-transform: uppercase; }
.clockbox { text-align: right; padding-right: 7vmin; line-height: 1; }
#clock { font-family: var(--font-big); font-size: 9vmin; color: var(--amber); text-shadow: 0 0 1.4vmin rgba(255,176,0,.6); }
#date  { font-size: 2.3vmin; color: var(--white); letter-spacing: .3vmin; margin-top: .4vmin; }

/* ---------- Hauptbereich ---------- */
main { position: relative; min-height: 0; }
.view { position: absolute; inset: 0; display: none; }
.view.active { display: flex; }

/* Flug-Ansicht */
#flightView { flex-direction: column; padding-top: 1.6vmin; gap: 1.6vmin; }
.hero {
  flex: 1.5; min-height: 0; display: flex; gap: 2vmin;
  border: 0.3vmin solid var(--grey); padding: 2vmin; position: relative;
  background-image: radial-gradient(rgba(255,255,255,.045) 0.18vmin, transparent 0.2vmin);
  background-size: 1.1vmin 1.1vmin; /* LED-Raster */
}
.hero-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
.tag { font-size: 1.8vmin; color: var(--grey-text); letter-spacing: .4vmin; }
#callsign { font-family: var(--font-big); font-size: 17vmin; line-height: .85; white-space: nowrap; }
#airline  { font-size: 3.4vmin; color: var(--white); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#actype   { font-size: 3vmin; color: var(--amber); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.4vmin; }
.cell { border-top: 0.3vmin solid var(--grey); padding-top: 1vmin; min-width: 0; }
.cell .lbl { font-size: 1.7vmin; color: var(--grey-text); letter-spacing: .3vmin; }
.cell .val { font-family: var(--font-big); font-size: 6.2vmin; line-height: 1; color: var(--white); white-space: nowrap; }
.cell .sub { font-size: 2vmin; color: var(--amber); white-space: nowrap; }
.arrow { display: inline-block; width: 4.2vmin; height: 4.2vmin; vertical-align: middle; margin-right: .8vmin; transition: transform 1s; }

/* Foto-Rahmen (Scanlines + Retro-Filter) */
#photoBox {
  display: none; flex: none; width: 34vw; position: relative;
  border: 0.3vmin solid var(--amber-dim); background: #000; overflow: hidden;
}
#photoBox.show { display: block; }
#photoBox img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  filter: sepia(.85) saturate(1.6) hue-rotate(-12deg) contrast(1.1) brightness(.85);
}
#photoBox::after { /* Scanlines */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.35) 0, rgba(0,0,0,.35) 0.2vmin, transparent 0.2vmin, transparent 0.6vmin);
}
#photoCredit {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; font-size: 1.4vmin;
  padding: .3vmin 1vmin; background: rgba(0,0,0,.65); color: var(--amber); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Tabelle "Weitere Flüge" */
.table { flex: 1; min-height: 0; border: 0.3vmin solid var(--grey); padding: 1.2vmin 2vmin; display: flex; flex-direction: column; }
.table h2 { font-size: 2vmin; font-weight: normal; color: var(--amber); letter-spacing: .5vmin; margin-bottom: .8vmin; }
.row { display: grid; grid-template-columns: 1.5fr 1.3fr 1.3fr 1fr 1fr 1fr; align-items: center; gap: 1vmin; flex: 1; border-top: 0.2vmin solid var(--grey); font-size: 3.2vmin; white-space: nowrap; }
.row.head { flex: none; font-size: 1.7vmin; color: var(--grey-text); letter-spacing: .3vmin; border-top: 0; padding-bottom: .4vmin; }
.row span { overflow: hidden; text-overflow: ellipsis; }
.row .c1 { color: var(--amber); }
.row .none { grid-column: 1 / -1; color: var(--grey-text); font-size: 2.4vmin; }

/* Leerlauf / Nacht-Ansicht */
#idleView { flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#idleClock { font-family: var(--font-big); font-size: 33vmin; line-height: .9; color: var(--amber); text-shadow: 0 0 2.4vmin rgba(255,176,0,.6); }
#idleClock .sec { font-size: 14vmin; color: var(--amber-dim); text-shadow: none; }
#idleDay  { font-size: 6vmin; letter-spacing: 1vmin; text-transform: uppercase; margin-top: 1vmin; }
#idleDate { font-size: 3.6vmin; color: var(--grey-text); letter-spacing: .5vmin; margin-top: .8vmin; }
#idleMsg  { margin-top: 4vmin; font-size: 2.6vmin; letter-spacing: .5vmin; color: var(--amber); animation: blink 1.6s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* Fußzeile */
footer { display: flex; justify-content: space-between; font-size: 1.6vmin; color: var(--grey-text); padding-top: .8vmin; border-top: 0.3vmin solid var(--grey); margin-top: 1.2vmin; letter-spacing: .2vmin; }
#hint { color: var(--amber-dim); }

/* Flip-Effekt beim Aktualisieren von Zeichen */
.flip { animation: flip .35s ease-out; }
@keyframes flip { 0% { opacity: .2; } 100% { opacity: 1; } }

/* ---------- Bedienelemente (blenden nach 5 s aus) ---------- */
.ctrl {
  position: fixed; z-index: 20; width: 6vmin; height: 6vmin; min-width: 36px; min-height: 36px;
  border: 0.25vmin solid var(--amber-dim); background: rgba(5,5,5,.8); color: var(--amber);
  border-radius: 1vmin; font-size: 3.4vmin; line-height: 1; cursor: pointer; font-family: var(--font);
  transition: opacity .6s;
}
#btnSettings { top: 1.2vmin; right: 1.2vmin; }
#btnFull     { bottom: 1.2vmin; right: 1.2vmin; }
body.ui-hidden .ctrl { opacity: 0; pointer-events: none; }

/* ---------- Einstellungen ---------- */
#settings {
  position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,.88);
}
#settings.open { display: flex; }
.panel { width: min(92vw, 640px); max-height: 94vh; overflow: auto; border: 0.3vmin solid var(--amber); background: #0a0a0a; padding: 2.4vmin; }
.panel h3 { font-weight: normal; color: var(--amber); letter-spacing: .5vmin; margin-bottom: 1.6vmin; font-size: 3vmin; }
.panel label { display: block; font-size: 2vmin; color: var(--grey-text); margin-top: 1.2vmin; }
.panel input[type=text], .panel input[type=number], .panel input[type=time] {
  width: 100%; margin-top: .4vmin; padding: 1.1vmin; font-family: var(--font); font-size: 2.8vmin;
  background: var(--grey); color: var(--white); border: 0.2vmin solid #333; border-radius: .6vmin;
}
.panel .two { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4vmin; }
.panel .chk { display: flex; align-items: center; gap: 1vmin; color: var(--white); }
.panel .chk input { width: 3vmin; height: 3vmin; }
.btns { display: flex; gap: 1.4vmin; margin-top: 2.2vmin; }
.btns button { flex: 1; padding: 1.4vmin; font-family: var(--font); font-size: 2.6vmin; background: var(--grey); color: var(--white); border: 0.2vmin solid #444; border-radius: .6vmin; cursor: pointer; }
.btns button.primary { background: var(--amber); color: #000; border-color: var(--amber); }
</style>
</head>

<body>
<div id="app">

  <!-- Kopfzeile -->
  <header>
    <div class="live"><div class="radar"></div><span>LIVE RADAR</span><span id="statusDot" class="dot"></span></div>
    <div id="loc">---</div>
    <div class="clockbox"><div id="clock">00:00:00</div><div id="date">---</div></div>
  </header>

  <main>
    <!-- Flug-Ansicht -->
    <section id="flightView" class="view">
      <div class="hero">
        <div class="hero-info">
          <div>
            <div class="tag">NÄCHSTES FLUGZEUG</div>
            <div id="callsign" class="amber">------</div>
            <div id="airline">---</div>
            <div id="actype">---</div>
          </div>
          <div class="cells">
            <div class="cell"><div class="lbl">HÖHE</div><div class="val" id="vAlt">---</div><div class="sub" id="sAlt">---</div></div>
            <div class="cell"><div class="lbl">GESCHWINDIGKEIT</div><div class="val" id="vSpd">---</div><div class="sub" id="sSpd">---</div></div>
            <div class="cell"><div class="lbl">ENTFERNUNG</div><div class="val" id="vDst">---</div><div class="sub" id="sDst">KM</div></div>
            <div class="cell"><div class="lbl">KURS</div>
              <div class="val"><svg class="arrow" id="arrow" viewBox="0 0 24 24"><path d="M12 2 L20 21 L12 16 L4 21 Z" fill="#FFB000"/></svg><span id="vHdg">---</span></div>
              <div class="sub" id="sHdg">---</div></div>
          </div>
        </div>
        <div id="photoBox"><img id="photo" alt=""><div id="photoCredit"></div></div>
      </div>

      <div class="table">
        <h2>WEITERE FLÜGE IM SEKTOR</h2>
        <div class="row head"><span>FLUG</span><span>TYP</span><span>HÖHE FT</span><span>KM/H</span><span>KM</span><span>KURS</span></div>
        <div id="rows" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
      </div>
    </section>

    <!-- Leerlauf-/Nacht-Ansicht -->
    <section id="idleView" class="view active">
      <div id="idleClock">00:00</div>
      <div id="idleDay">---</div>
      <div id="idleDate">---</div>
      <div id="idleMsg">VERBINDE...</div>
    </section>
  </main>

  <footer><span id="foot">---</span><span id="hint"></span></footer>
</div>

<!-- Bedienelemente -->
<button class="ctrl" id="btnSettings" title="Einstellungen">&#9881;</button>
<button class="ctrl" id="btnFull" title="Vollbild">&#9974;</button>

<!-- Einstellungen -->
<div id="settings">
  <div class="panel">
    <h3>EINSTELLUNGEN</h3>
    <label>Ortsname<input type="text" id="sName"></label>
    <div class="two">
      <label>Breitengrad (LAT)<input type="text" inputmode="decimal" id="sLat"></label>
      <label>Längengrad (LON)<input type="text" inputmode="decimal" id="sLon"></label>
    </div>
    <div class="two">
      <label>Radius (km)<input type="number" id="sRadius" min="1" max="400" step="1"></label>
      <label>Abfrage-Intervall (Sek., min. 10)<input type="number" id="sPoll" min="10" max="300" step="1"></label>
    </div>
    <label class="chk" style="margin-top:1.6vmin"><input type="checkbox" id="sNight"> Nachtmodus aktiv (keine Abfragen, gedimmt)</label>
    <div class="two">
      <label>Nacht von<input type="time" id="sNStart"></label>
      <label>Nacht bis<input type="time" id="sNEnd"></label>
    </div>
    <div class="btns">
      <button id="bReset">ZURÜCKSETZEN</button>
      <button id="bClose">SCHLIESSEN</button>
      <button id="bSave" class="primary">SPEICHERN</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   Overhead – Anwendungslogik (Vanilla JS, ES5-kompatibel)
   ========================================================= */

/* ---------------------------------------------------------
   KONFIGURATION – hier Standardwerte anpassen.
   Werte aus dem Einstellungs-Menü (localStorage) haben Vorrang.
   --------------------------------------------------------- */
var DEFAULTS = {
  LAT: 50.0379,          // Breitengrad deines Standorts
  LON: 8.5622,           // Längengrad deines Standorts
  NAME: 'FRANKFURT',     // Anzeigename in der Kopfzeile
  RADIUS_KM: 15,         // Suchradius in km (wird intern in Seemeilen umgerechnet)
  POLL_SECONDS: 15,      // Abfrage-Intervall in Sekunden
  NIGHT_ENABLED: true,   // Nachtmodus an/aus
  NIGHT_START: '23:30',  // Beginn Ruhezeit (HH:MM)
  NIGHT_END: '06:00',    // Ende Ruhezeit (HH:MM)
  MAX_OTHERS: 3          // Anzahl weiterer Flüge in der Tabelle
};

/* API-Endpunkte (Reihenfolge = Priorität, der zweite ist der Fallback) */
var API_SOURCES = [
  { name: 'airplanes.live', url: 'https://api.airplanes.live/v2/point/{lat}/{lon}/{nm}' },
  { name: 'adsb.lol',       url: 'https://api.adsb.lol/v2/point/{lat}/{lon}/{nm}' }
];
var PHOTO_API = 'https://api.planespotters.net/pub/photos/hex/';
var KM_PER_NM = 1.852;
var FT_PER_M = 3.28084;

var CONFIG = loadConfig();

function loadConfig() {
  var c = {}, k, saved = null;
  for (k in DEFAULTS) c[k] = DEFAULTS[k];
  try { saved = JSON.parse(localStorage.getItem('flightwall.config') || 'null'); } catch (e) {}
  if (saved) for (k in saved) if (k in DEFAULTS) c[k] = saved[k];
  return c;
}
function saveConfig() {
  try { localStorage.setItem('flightwall.config', JSON.stringify(CONFIG)); } catch (e) {}
}

/* ---------------------------------------------------------
   Hilfsfunktionen
   --------------------------------------------------------- */
function $(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtInt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
var DAYS = ['SONNTAG','MONTAG','DIENSTAG','MITTWOCH','DONNERSTAG','FREITAG','SAMSTAG'];
var DAYS_SHORT = ['SO','MO','DI','MI','DO','FR','SA'];
var COMPASS = ['N','NNO','NO','ONO','O','OSO','SO','SSO','S','SSW','SW','WSW','W','WNW','NW','NNW'];

function haversineKm(lat1, lon1, lat2, lon2) {
  var R = 6371, rad = Math.PI / 180;
  var dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/* Fetch mit Timeout (alte Browser: kein AbortController nötig) */
function fetchJson(url, ms) {
  return new Promise(function (resolve, reject) {
    var done = false;
    var t = setTimeout(function () { if (!done) { done = true; reject(new Error('timeout')); } }, ms);
    fetch(url, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { if (!done) { done = true; clearTimeout(t); resolve(j); } })
      .catch(function (e) { if (!done) { done = true; clearTimeout(t); reject(e); } });
  });
}

/* ---------------------------------------------------------
   Flip-/Matrix-Effekt: Zeichen "scrambeln" kurz und rasten
   von links nach rechts auf den neuen Wert ein.
   --------------------------------------------------------- */
var SCRAMBLE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function setText(el, text) {
  text = String(text);
  if (el._target === text) return;
  el._target = text;
  if (el._timer) clearInterval(el._timer);
  var steps = 7, i = 0;
  el._timer = setInterval(function () {
    i++;
    if (i >= steps) {
      clearInterval(el._timer); el._timer = null;
      el.textContent = text;
      return;
    }
    var reveal = Math.floor(text.length * i / steps), out = '', j, ch;
    for (j = 0; j < text.length; j++) {
      ch = text.charAt(j);
      out += (j < reveal || ch === ' ' || ch === '.' || ch === '-') ? ch : SCRAMBLE.charAt(Math.floor(Math.random() * SCRAMBLE.length));
    }
    el.textContent = out;
  }, 35);
  el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip');
}

/* ---------------------------------------------------------
   Airline-Kürzel (Fallback, falls "ownOp" fehlt)
   --------------------------------------------------------- */
var AIRLINES = {
  DLH:'Lufthansa', EWG:'Eurowings', CFG:'Condor', TUI:'TUIfly', RYR:'Ryanair', EZY:'easyJet', WZZ:'Wizz Air',
  BAW:'British Airways', AFR:'Air France', KLM:'KLM', SWR:'Swiss', AUA:'Austrian', BEL:'Brussels Airlines',
  UAE:'Emirates', QTR:'Qatar Airways', ETD:'Etihad', THY:'Turkish Airlines', SIA:'Singapore Airlines',
  UAL:'United Airlines', DAL:'Delta Air Lines', AAL:'American Airlines', ACA:'Air Canada',
  SAS:'SAS', FIN:'Finnair', IBE:'Iberia', VLG:'Vueling', TAP:'TAP Portugal', ITY:'ITA Airways',
  NAX:'Norwegian', LOT:'LOT Polish', AEE:'Aegean', ETH:'Ethiopian', MSR:'EgyptAir', ELY:'El Al',
  CLX:'Cargolux', GEC:'Lufthansa Cargo', FDX:'FedEx', UPS:'UPS', BOX:'AeroLogic', DHK:'DHL', ADB:'Antonov',
  CTN:'Croatia Airlines', SXS:'SunExpress', PGT:'Pegasus', LGL:'Luxair', EJU:'easyJet Europe'
};
function airlineOf(a, callsign) {
  if (a.ownOp) return a.ownOp;
  var p = (callsign || '').substring(0, 3).toUpperCase();
  if (/^[A-Z]{3}\d/.test(callsign || '') && AIRLINES[p]) return AIRLINES[p];
  return '';
}

/* ---------------------------------------------------------
   Daten holen & aufbereiten
   --------------------------------------------------------- */
var lastSource = '-', lastUpdate = null, lastError = '';

function radiusNm() { return Math.max(1, Math.min(250, Math.ceil(CONFIG.RADIUS_KM / KM_PER_NM))); }

/* Versucht Quelle 1, bei Fehler/Rate-Limit automatisch Quelle 2 */
function fetchAircraft() {
  var idx = 0;
  function attempt() {
    var src = API_SOURCES[idx];
    var url = src.url.replace('{lat}', CONFIG.LAT).replace('{lon}', CONFIG.LON).replace('{nm}', radiusNm());
    return fetchJson(url, 8000).then(function (data) {
      if (!data || !data.ac) throw new Error('Ungültige Antwort');
      lastSource = src.name;
      return data.ac;
    }).catch(function (err) {
      idx++;
      if (idx < API_SOURCES.length) return attempt();
      throw err;
    });
  }
  return attempt();
}

function normalize(list) {
  var out = [], i, a, alt, lat, lon, cs;
  for (i = 0; i < list.length; i++) {
    a = list[i];
    lat = a.lat; lon = a.lon;
    if (typeof lat !== 'number' || typeof lon !== 'number') continue;
    if (a.alt_baro === 'ground') continue;               // Flugzeuge am Boden ausblenden
    alt = typeof a.alt_baro === 'number' ? a.alt_baro : (typeof a.alt_geom === 'number' ? a.alt_geom : null);
    cs = (a.flight || '').replace(/\s+$/, '') || a.r || a.hex || '------';
    out.push({
      hex: a.hex,
      callsign: cs.toUpperCase(),
      airline: airlineOf(a, a.flight),
      type: (a.desc || a.t || '').toUpperCase(),
      altFt: alt,
      gsKt: typeof a.gs === 'number' ? a.gs : null,
      track: typeof a.track === 'number' ? a.track : null,
      distKm: haversineKm(CONFIG.LAT, CONFIG.LON, lat, lon)
    });
  }
  out.sort(function (x, y) { return x.distKm - y.distKm; });
  return out.filter(function (p) { return p.distKm <= CONFIG.RADIUS_KM * 1.05; });
}

/* ---------------------------------------------------------
   Darstellung
   --------------------------------------------------------- */
var currentHex = null;
var photoCache = {};

function compass(deg) { return COMPASS[Math.round(deg / 22.5) % 16]; }

function renderFlights(list) {
  var main = list[0], i, html = '', p;
  showView('flightView');

  setText($('callsign'), main.callsign);
  setText($('airline'), main.airline || 'AIRLINE UNBEKANNT');
  setText($('actype'), main.type || 'TYP UNBEKANNT');

  setText($('vAlt'), main.altFt !== null ? fmtInt(main.altFt) + ' FT' : '---');
  setText($('sAlt'), main.altFt !== null ? fmtInt(main.altFt / FT_PER_M) + ' M' : '---');
  setText($('vSpd'), main.gsKt !== null ? fmtInt(main.gsKt * KM_PER_NM) + ' KM/H' : '---');
  setText($('sSpd'), main.gsKt !== null ? fmtInt(main.gsKt) + ' KN' : '---');
  setText($('vDst'), main.distKm.toFixed(1).replace('.', ',') + ' KM');
  setText($('sDst'), 'IM SEKTOR');
  if (main.track !== null) {
    setText($('vHdg'), pad3(Math.round(main.track)) + '°');
    setText($('sHdg'), compass(main.track));
    $('arrow').style.transform = 'rotate(' + main.track + 'deg)';
  } else { setText($('vHdg'), '---'); setText($('sHdg'), '---'); }

  /* Tabelle der weiteren Flüge */
  var others = list.slice(1, 1 + CONFIG.MAX_OTHERS);
  if (!others.length) {
    html = '<div class="row"><span class="none">KEINE WEITEREN FLÜGE IM SEKTOR</span></div>';
  } else {
    for (i = 0; i < others.length; i++) {
      p = others[i];
      html += '<div class="row"><span class="c1">' + esc(p.callsign) + '</span><span>' + esc(shortType(p)) +
        '</span><span>' + (p.altFt !== null ? fmtInt(p.altFt) : '---') + '</span><span>' +
        (p.gsKt !== null ? fmtInt(p.gsKt * KM_PER_NM) : '---') + '</span><span>' +
        p.distKm.toFixed(1).replace('.', ',') + '</span><span>' +
        (p.track !== null ? pad3(Math.round(p.track)) + '° ' + compass(p.track) : '---') + '</span></div>';
    }
  }
  var rows = $('rows');
  if (rows._html !== html) { rows.innerHTML = html; rows._html = html; rows.classList.remove('flip'); void rows.offsetWidth; rows.classList.add('flip'); }

  /* Foto nur laden, wenn sich das nächste Flugzeug ändert */
  if (main.hex !== currentHex) { currentHex = main.hex; loadPhoto(main.hex); }
}
function pad3(n) { return (n < 10 ? '00' : n < 100 ? '0' : '') + n; }
function shortType(p) { return (p.type || '---').replace(/^(AIRBUS|BOEING)\s+/, function (m) { return m.charAt(0); }).substring(0, 12); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

function showView(id) {
  $('flightView').className = 'view' + (id === 'flightView' ? ' active' : '');
  $('idleView').className = 'view' + (id === 'idleView' ? ' active' : '');
}
function showIdle(msg) {
  showView('idleView');
  setText($('idleMsg'), msg);
  currentHex = null; hidePhoto();
}

/* ---------------------------------------------------------
   Optional: Flugzeug-Foto (Planespotters) – bei Fehler ausblenden
   --------------------------------------------------------- */
function hidePhoto() { $('photoBox').className = ''; }
function loadPhoto(hex) {
  hidePhoto();
  if (!hex) return;
  var cached = photoCache[hex];
  if (cached !== undefined) { applyPhoto(hex, cached); return; }
  fetchJson(PHOTO_API + encodeURIComponent(hex), 6000).then(function (d) {
    var ph = d && d.photos && d.photos[0];
    var res = ph ? { src: (ph.thumbnail_large || ph.thumbnail || {}).src, by: ph.photographer || '' } : null;
    if (res && !res.src) res = null;
    photoCache[hex] = res;
    applyPhoto(hex, res);
  }).catch(function () { /* kein Foto -> Bereich bleibt ausgeblendet */ });
}
function applyPhoto(hex, res) {
  if (hex !== currentHex || !res) return;       // veraltete Antwort ignorieren
  var img = $('photo');
  img.onload = function () { if (hex === currentHex) $('photoBox').className = 'show'; };
  img.onerror = hidePhoto;
  img.src = res.src;
  $('photoCredit').textContent = '© ' + res.by + ' / PLANESPOTTERS.NET';
}

/* ---------------------------------------------------------
   Nachtmodus
   --------------------------------------------------------- */
function toMin(s) { var p = String(s).split(':'); return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0); }
function isNight(d) {
  if (!CONFIG.NIGHT_ENABLED) return false;
  var now = d.getHours() * 60 + d.getMinutes(), s = toMin(CONFIG.NIGHT_START), e = toMin(CONFIG.NIGHT_END);
  if (s === e) return false;
  return s < e ? (now >= s && now < e) : (now >= s || now < e);   // Zeitfenster über Mitternacht möglich
}

/* ---------------------------------------------------------
   Polling
   --------------------------------------------------------- */
var pollTimer = null, nightNow = false, pollBusy = false;

function schedulePoll(ms) {
  if (pollTimer) clearTimeout(pollTimer);
  pollTimer = setTimeout(poll, ms);
}
function poll() {
  var interval = Math.max(10, CONFIG.POLL_SECONDS) * 1000;
  if (nightNow || document.hidden || pollBusy) { schedulePoll(interval); return; }
  pollBusy = true;
  fetchAircraft().then(function (raw) {
    var list = normalize(raw);
    lastUpdate = new Date(); lastError = '';
    $('statusDot').className = 'dot ok';
    if (list.length) renderFlights(list); else showIdle('KEINE FLUGZEUGE IM SEKTOR - SCANNING...');
    updateFooter();
  }).catch(function (err) {
    lastError = err && err.message ? err.message : 'Fehler';
    $('statusDot').className = 'dot err';
    if (!lastUpdate) showIdle('KEINE VERBINDUNG - NEUER VERSUCH...');
    updateFooter();
  }).then(function () {
    pollBusy = false;
    schedulePoll(interval);
  });
}
function updateFooter() {
  var t = lastUpdate ? pad(lastUpdate.getHours()) + ':' + pad(lastUpdate.getMinutes()) + ':' + pad(lastUpdate.getSeconds()) : '--:--:--';
  $('foot').textContent = 'QUELLE ' + lastSource.toUpperCase() + '  |  RADIUS ' + CONFIG.RADIUS_KM + ' KM  |  UPDATE ' + t +
    (lastError ? '  |  FEHLER: ' + lastError.toUpperCase() : '');
}

/* ---------------------------------------------------------
   Uhr (jede Sekunde) + Nachtmodus-Umschaltung
   --------------------------------------------------------- */
function tick() {
  var d = new Date(), hh = pad(d.getHours()), mm = pad(d.getMinutes()), ss = pad(d.getSeconds());
  $('clock').textContent = hh + ':' + mm + ':' + ss;
  var dateStr = DAYS_SHORT[d.getDay()] + ', ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();
  $('date').textContent = dateStr;
  $('idleClock').innerHTML = hh + ':' + mm + '<span class="sec">:' + ss + '</span>';
  $('idleDay').textContent = DAYS[d.getDay()];
  $('idleDate').textContent = pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();

  var n = isNight(d);
  if (n !== nightNow) {
    nightNow = n;
    document.body.className = (n ? 'night ' : '') + (document.body.className.indexOf('ui-hidden') >= 0 ? 'ui-hidden' : '');
    if (n) { showIdle('NACHTMODUS - ABFRAGEN PAUSIERT'); $('statusDot').className = 'dot'; }
    else { showIdle('SCANNING...'); poll(); }
  }
}

/* ---------------------------------------------------------
   Screen Wake Lock (mit Fallback-Hinweis)
   --------------------------------------------------------- */
var wakeLock = null;
function requestWakeLock() {
  if (!('wakeLock' in navigator)) {
    $('hint').textContent = 'WAKE LOCK NICHT VERFÜGBAR - ANDROID: DISPLAY-TIMEOUT AUF "NIE" STELLEN';
    return;
  }
  navigator.wakeLock.request('screen').then(function (l) {
    wakeLock = l; $('hint').textContent = '';
    l.addEventListener('release', function () { wakeLock = null; });
  }).catch(function () {
    $('hint').textContent = 'WAKE LOCK ABGELEHNT (HTTPS NÖTIG) - DISPLAY-TIMEOUT MANUELL AUF "NIE"';
  });
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) { requestWakeLock(); if (!nightNow) poll(); }
});

/* ---------------------------------------------------------
   Vollbild
   --------------------------------------------------------- */
function toggleFullscreen() {
  var d = document, el = d.documentElement;
  var isFs = d.fullscreenElement || d.webkitFullscreenElement;
  if (isFs) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
  else {
    var f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f) { var r = f.call(el); if (r && r.catch) r.catch(function () {}); }
    requestWakeLock();
  }
}
$('btnFull').addEventListener('click', toggleFullscreen);

/* ---------------------------------------------------------
   Bedienelemente nach 5 s Inaktivität ausblenden
   --------------------------------------------------------- */
var uiTimer = null;
function showUi() {
  document.body.className = document.body.className.replace(/\s*ui-hidden/, '');
  if (uiTimer) clearTimeout(uiTimer);
  uiTimer = setTimeout(function () {
    if (!$('settings').classList.contains('open')) document.body.className += ' ui-hidden';
  }, 5000);
}
document.addEventListener('touchstart', showUi, { passive: true });
document.addEventListener('mousemove', showUi);
document.addEventListener('mousedown', showUi);

/* ---------------------------------------------------------
   Einstellungs-Menü
   --------------------------------------------------------- */
function openSettings() {
  $('sName').value = CONFIG.NAME;
  $('sLat').value = CONFIG.LAT;
  $('sLon').value = CONFIG.LON;
  $('sRadius').value = CONFIG.RADIUS_KM;
  $('sPoll').value = CONFIG.POLL_SECONDS;
  $('sNight').checked = !!CONFIG.NIGHT_ENABLED;
  $('sNStart').value = CONFIG.NIGHT_START;
  $('sNEnd').value = CONFIG.NIGHT_END;
  $('settings').classList.add('open');
}
function closeSettings() { $('settings').classList.remove('open'); showUi(); }
function num(v, fallback) { var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? fallback : n; }

$('btnSettings').addEventListener('click', openSettings);
$('bClose').addEventListener('click', closeSettings);
$('bSave').addEventListener('click', function () {
  CONFIG.NAME = $('sName').value || DEFAULTS.NAME;
  CONFIG.LAT = Math.max(-90, Math.min(90, num($('sLat').value, CONFIG.LAT)));
  CONFIG.LON = Math.max(-180, Math.min(180, num($('sLon').value, CONFIG.LON)));
  CONFIG.RADIUS_KM = Math.max(1, Math.min(400, num($('sRadius').value, CONFIG.RADIUS_KM)));
  CONFIG.POLL_SECONDS = Math.max(10, num($('sPoll').value, CONFIG.POLL_SECONDS));
  CONFIG.NIGHT_ENABLED = $('sNight').checked;
  CONFIG.NIGHT_START = $('sNStart').value || DEFAULTS.NIGHT_START;
  CONFIG.NIGHT_END = $('sNEnd').value || DEFAULTS.NIGHT_END;
  saveConfig();
  applyConfig();
  closeSettings();
});
$('bReset').addEventListener('click', function () {
  try { localStorage.removeItem('flightwall.config'); } catch (e) {}
  CONFIG = loadConfig();
  openSettings();
});

function applyConfig() {
  setText($('loc'), CONFIG.NAME);
  lastUpdate = null; currentHex = null;
  nightNow = isNight(new Date());
  document.body.className = nightNow ? 'night' : '';
  if (nightNow) showIdle('NACHTMODUS - ABFRAGEN PAUSIERT'); else { showIdle('SCANNING...'); poll(); }
  updateFooter();
}

/* ---------------------------------------------------------
   Start
   --------------------------------------------------------- */
setInterval(tick, 1000);
tick();
applyConfig();
requestWakeLock();
showUi();
</script>
</body>
</html>
